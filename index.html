<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Ticket Handler Notice — PRD</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: true, curve: 'basis' } });
  window.__mermaidRender = () => mermaid.run({ querySelector: '.mermaid' });
</script>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b; --faint: #9a9a96;
    --rule: #e5e5e2; --rule-soft: #f0f0ee;
    --link: #1f3c6e;
    --code-bg: #f4f4f2;
    --flag: #8a5a12; --flag-wash: #fbf4e7; --flag-rule: #e8d9bc;
    --crit: #a32219; --crit-wash: #fceeec;
    --good: #2f6b3a; --good-wash: #edf5ee;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.6; color: var(--ink); background: var(--bg);
  }

  /* ---- layout ---- */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); max-width: 1220px; margin: 0 auto; gap: 40px; }
  nav.toc {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 44px 0 60px 24px; font-size: 12.5px; line-height: 1.45;
  }
  nav.toc .toc-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
  nav.toc a { display: block; padding: 3px 10px 3px 9px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
  nav.toc a:hover { color: var(--ink); background: var(--rule-soft); }
  nav.toc a.lvl3 { padding-left: 20px; font-size: 12px; color: var(--faint); }
  nav.toc a.active { color: var(--flag); border-left-color: var(--flag); font-weight: 600; background: var(--flag-wash); }
  main { min-width: 0; padding: 44px 40px 140px 0; }
  @media (max-width: 1000px) {
    .shell { grid-template-columns: 1fr; gap: 0; }
    nav.toc { position: static; height: auto; padding: 20px 18px 0; border-bottom: 1px solid var(--rule); }
    nav.toc .toc-inner { display: flex; flex-wrap: wrap; gap: 2px; }
    nav.toc a { border-left: none; border-radius: 4px; padding: 3px 8px; }
    nav.toc a.lvl3 { display: none; }
    main { padding: 24px 18px 80px; }
  }

  /* ---- masthead ---- */
  header.doc { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 10px; }
  header.doc .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--flag); font-weight: 700; }
  header.doc h1 { font-size: 27px; margin: 9px 0 8px; line-height: 1.22; letter-spacing: -.018em; }
  header.doc .sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .pillrow { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0 0; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); }
  .pill b { color: var(--ink); font-weight: 700; }
  .pill.warn { background: var(--flag-wash); border-color: var(--flag-rule); color: var(--flag); }
  .pill.ok { background: var(--good-wash); border-color: #cfe3d3; color: var(--good); }

  /* ---- doc switcher ---- */
  .tabs { display: flex; gap: 4px; margin: 22px 0 26px; border-bottom: 1px solid var(--rule); }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 7px 13px; margin-bottom: -1px; color: var(--muted);
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  /* ---- markdown body ---- */
  #content h1 { font-size: 24px; margin: 36px 0 12px; }
  #content h2 {
    font-size: 20px; margin: 44px 0 14px; padding-bottom: 6px;
    border-bottom: 1px solid var(--rule); scroll-margin-top: 18px; letter-spacing: -.012em;
  }
  #content h3 { font-size: 15.5px; margin: 28px 0 8px; scroll-margin-top: 18px; }
  #content h4 { font-size: 14px; margin: 18px 0 6px; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 8px 0 12px; padding-left: 24px; }
  #content li { margin: 4px 0; }
  #content hr { border: none; border-top: 1px dashed var(--rule); margin: 34px 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .87em; background: var(--code-bg); padding: .08em .35em; border-radius: 3px; border: 1px solid var(--rule); }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; border: 1px solid var(--rule); }
  pre code { background: none; padding: 0; border: none; font-size: inherit; }
  blockquote { margin: 10px 0; padding: 10px 14px; background: var(--code-bg); border-left: 3px solid var(--muted); color: #333; }

  /* ---- tables ---- */
  .tablewrap { overflow-x: auto; margin: 12px 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 11px; border: 1px solid var(--rule); vertical-align: top; line-height: 1.5; }
  th { background: var(--code-bg); font-weight: 650; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
  tbody tr:nth-child(even) { background: #fcfcfb; }
  td:first-child { white-space: nowrap; }
  td:first-child code, th:first-child { white-space: nowrap; }

  /* ---- diagrams ---- */
  .mermaid { text-align: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; margin: 16px 0; overflow-x: auto; }

  /* ---- semantic highlights, derived from the markdown ---- */
  .aiflag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
    background: var(--flag-wash); color: var(--flag); border: 1px solid var(--flag-rule);
    border-radius: 3px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; font-style: normal;
  }
  tr.has-flag td { background: #fffdf8 !important; }
  .idchip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .86em; font-weight: 600; color: var(--flag);
    background: var(--flag-wash); border: 1px solid var(--flag-rule);
    border-radius: 3px; padding: .04em .32em; white-space: nowrap;
  }
  .status-settled { color: var(--good); font-weight: 650; }
  .status-open { color: var(--crit); font-weight: 650; }

  #content .loading { color: var(--muted); font-size: 14px; padding: 40px 0; }
  #content .err { color: var(--crit); background: var(--crit-wash); padding: 14px 16px; border-radius: 6px; }

  footer.doc { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--faint); line-height: 1.6; }
  footer.doc a { color: var(--muted); }
</style>
</head>
<body>
<div class="shell">

<nav class="toc" aria-label="Contents">
  <div class="toc-label">Contents</div>
  <div class="toc-inner" id="toc"></div>
</nav>

<main>
  <header class="doc">
    <div class="eyebrow">Service Tickets POD · Roadmap item 01</div>
    <h1 id="doctitle">Service Ticket Handler Notice</h1>
    <div class="sub" id="docsub">
      Renders the markdown source live from this repo — the document you are reading is the
      <code>.md</code> file, not a copy of it. Edit the markdown, push, and this page changes with it.
    </div>
    <div class="pillrow" id="pills"></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-prd" aria-selected="true">PRD</button>
    <button role="tab" id="tab-trade" aria-selected="false">Tradeoff log</button>
  </div>

  <div id="content"><p class="loading">Loading the markdown source…</p></div>

  <footer class="doc" id="foot"></footer>
</main>

</div>

<script>
(function () {
  'use strict';

  var REPO = 'ashish-raj-wiom/service-ticket-handler-notice-prd';
  var BRANCH = 'main';

  var DOCS = {
    prd:   { file: 'Service_Ticket_Handler_Notice_PRD.md',       label: 'PRD' },
    trade: { file: 'Service_Ticket_Handler_Notice_Tradeoffs.md', label: 'Tradeoff log' }
  };

  var rawUrl  = function (f) { return 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + f; };
  var blobUrl = function (f) { return 'https://github.com/' + REPO + '/blob/' + BRANCH + '/' + f; };

  var contentEl = document.getElementById('content');
  var tocEl     = document.getElementById('toc');
  var pillsEl   = document.getElementById('pills');
  var footEl    = document.getElementById('foot');
  var titleEl   = document.getElementById('doctitle');

  marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });

  function slug(s) {
    return s.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60);
  }

  // Pull mermaid blocks out before markdown parsing, re-inject as text afterwards.
  // Keeps the diagram source untouched by the markdown parser.
  function render(md) {
    var diagrams = [];
    var staged = md.replace(/```mermaid\r?\n([\s\S]*?)```/g, function (_, body) {
      diagrams.push(body);
      return '<div class="mermaid-slot" data-i="' + (diagrams.length - 1) + '"></div>';
    });

    var html = marked.parse(staged);
    contentEl.innerHTML = html;

    contentEl.querySelectorAll('.mermaid-slot').forEach(function (slot) {
      var d = document.createElement('div');
      d.className = 'mermaid';
      d.textContent = diagrams[+slot.dataset.i];   // textContent: never re-parsed as HTML
      slot.replaceWith(d);
    });

    // First h1 becomes the masthead title rather than repeating in the body.
    var h1 = contentEl.querySelector('h1');
    if (h1) { titleEl.textContent = h1.textContent; document.title = h1.textContent + ' — PRD'; h1.remove(); }

    decorate(md);
    buildToc();
    if (window.__mermaidRender) window.__mermaidRender();
  }

  function decorate(md) {
    // 1. AI-generated markers → badges, and flag the row they sit in.
    var flags = 0;
    contentEl.querySelectorAll('em').forEach(function (em) {
      if (!/^AI GENERATED\s*—\s*review$/.test(em.textContent.trim())) return;
      flags++;
      var badge = document.createElement('span');
      badge.className = 'aiflag';
      badge.textContent = 'AI — REVIEW';
      // absorb the warning emoji sitting immediately before it
      var prev = em.previousSibling;
      if (prev && prev.nodeType === 3) prev.textContent = prev.textContent.replace(/\s*⚠️\s*$/, ' ');
      em.replaceWith(badge);
      var row = badge.closest('tr');
      if (row) row.classList.add('has-flag');
    });

    // 2. ID references → chips. Only inside table cells and list items, never in headings or code.
    var ID = /\b(?:AC-[A-Z]{2,5}-\d+|MQ-\d+|C-\d{2}|G[1-9]\d?|T[1-9]\d?|M[1-9]|P[1-9]|R[1-9][a-c]?)\b/g;
    contentEl.querySelectorAll('td, li').forEach(function (host) {
      walkText(host, function (node) {
        if (node.parentElement.closest('code, pre, a, .aiflag, .idchip')) return;
        if (!ID.test(node.textContent)) return;
        ID.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var last = 0, m;
        while ((m = ID.exec(node.textContent)) !== null) {
          if (m.index > last) frag.appendChild(document.createTextNode(node.textContent.slice(last, m.index)));
          var chip = document.createElement('span');
          chip.className = 'idchip';
          chip.textContent = m[0];
          frag.appendChild(chip);
          last = m.index + m[0].length;
        }
        if (last < node.textContent.length) frag.appendChild(document.createTextNode(node.textContent.slice(last)));
        node.replaceWith(frag);
      });
    });

    // 3. AC status column colouring.
    contentEl.querySelectorAll('td').forEach(function (td) {
      var t = td.textContent.trim();
      if (t === 'Settled') td.className = 'status-settled';
      else if (t === 'OPEN') td.className = 'status-open';
    });

    // 4. Tables get their own horizontal scroll container.
    contentEl.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentElement.classList.contains('tablewrap')) return;
      var w = document.createElement('div');
      w.className = 'tablewrap';
      tb.replaceWith(w);
      w.appendChild(tb);
    });

    buildPills(md, flags);
  }

  function walkText(root, fn) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(fn);
  }

  // Header facts come from the markdown itself, so the pills can never drift from the source.
  function buildPills(md, flags) {
    var head = md.slice(0, 1200);
    var grab = function (label) {
      var m = head.match(new RegExp('\\*\\*' + label + '\\*\\*\\s*—\\s*([^|⚠\\n]+)'));
      return m ? m[1].trim() : null;
    };
    var pills = [];
    var push = function (k, v, cls) { if (v) pills.push('<span class="pill ' + (cls || '') + '"><b>' + k + '</b> ' + v + '</span>'); };

    push('Status', grab('Status'));
    push('Version', grab('Version'));
    push('Owner', grab('Owner'));
    push('Sign-off', grab('Sign-off'));
    if (flags) pills.push('<span class="pill warn"><b>' + flags + '</b> items awaiting your review</span>');
    var ov = (md.match(/^\|\s*L\d[^|]*\|/gm) || []).length;
    if (ov) pills.push('<span class="pill warn"><b>' + ov + '</b> recorded override' + (ov > 1 ? 's' : '') + '</span>');

    pillsEl.innerHTML = pills.join('');
  }

  function buildToc() {
    var items = contentEl.querySelectorAll('h2, h3');
    var html = '';
    items.forEach(function (h) {
      var id = slug(h.textContent);
      if (!id) return;
      h.id = id;
      html += '<a href="#' + id + '" class="' + (h.tagName === 'H3' ? 'lvl3' : 'lvl2') + '">' +
              h.textContent.replace(/\s*\([^)]*\)\s*$/, '') + '</a>';
    });
    tocEl.innerHTML = html;
    spy();
  }

  function spy() {
    var links = Array.prototype.slice.call(tocEl.querySelectorAll('a'));
    if (!links.length || !('IntersectionObserver' in window)) return;
    var byId = {};
    links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) { a.classList.remove('active'); });
        var a = byId[e.target.id];
        if (a) a.classList.add('active');
      });
    }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
    contentEl.querySelectorAll('h2, h3').forEach(function (h) { if (h.id) io.observe(h); });
  }

  function load(key) {
    var doc = DOCS[key];
    contentEl.innerHTML = '<p class="loading">Loading the markdown source…</p>';
    tocEl.innerHTML = '';
    pillsEl.innerHTML = '';

    fetch(rawUrl(doc.file), { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (md) {
        render(md);
        footEl.innerHTML =
          'Source of truth: <a href="' + blobUrl(doc.file) + '">' + doc.file + '</a> on <code>' + BRANCH + '</code>. ' +
          'This page renders that file directly — to change the document, change the markdown. ' +
          'GitHub caches raw files for a few minutes, so a fresh push can take a moment to show. ' +
          '<br>Repository: <a href="https://github.com/' + REPO + '">' + REPO + '</a>';
      })
      .catch(function (err) {
        contentEl.innerHTML = '<p class="err">Could not load <code>' + doc.file + '</code> (' + err.message + ').' +
          ' Read it directly on <a href="' + blobUrl(doc.file) + '">GitHub</a>.</p>';
      });
  }

  var tabs = { prd: document.getElementById('tab-prd'), trade: document.getElementById('tab-trade') };
  Object.keys(tabs).forEach(function (k) {
    tabs[k].addEventListener('click', function () {
      Object.keys(tabs).forEach(function (j) { tabs[j].setAttribute('aria-selected', String(j === k)); });
      location.hash = k === 'prd' ? '' : '#doc=trade';
      load(k);
      window.scrollTo(0, 0);
    });
  });

  var initial = /doc=trade/.test(location.hash) ? 'trade' : 'prd';
  tabs[initial].setAttribute('aria-selected', 'true');
  if (initial !== 'prd') tabs.prd.setAttribute('aria-selected', 'false');
  load(initial);
})();
</script>
</body>
</html>
